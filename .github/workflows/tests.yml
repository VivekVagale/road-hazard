name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # The tests cover the dataset conversion (VOC to YOLO, block split),
      # which is plain Python; torch and ultralytics are only needed for training.
      - run: pip install "pytest>=8.0" pytest-github-actions-annotate-failures
      - run: python -m pytest -q -rs
